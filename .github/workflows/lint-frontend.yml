name: Lint Frontend

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'ui/**'
      - '.github/workflows/lint-frontend.yml'
  pull_request:
    branches:
      - master
      - main
    paths:
      - 'ui/**'
      - '.github/workflows/lint-frontend.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npm run check
